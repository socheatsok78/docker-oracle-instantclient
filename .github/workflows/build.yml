name: "Build"

on:
  workflow_dispatch:
    inputs:
      permit-login:
        type: boolean
        default: false
        description: "Permit login to container registry"
      permit-push:
        type: boolean
        description: "Permit pushing built images to container registry"
        default: false
      permit-cache:
        type: boolean
        description: "Permit using GitHub Actions cache for buildx"
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate matrix
        id: generate
        run: ./.github/scripts/generate-build-matrix.sh

  docker:
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: socheatsok78/uses/.github/workflows/docker-buildx-bake.yml@main
    with:
      flavor: latest=false
      source: "{{defaultContext}}:library/${{ matrix.version }}"
      tags: type=raw,value=${{ matrix.version }}
      permit-login: ${{ inputs.permit-login }}
      permit-push: ${{ inputs.permit-push && github.event_name != 'pull_request' }}
      permit-cache: ${{ inputs.permit-cache }}
    secrets: inherit
