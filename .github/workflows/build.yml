name: "Build"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate matrix
        id: generate
        run: ./.github/scripts/generate-build-matrix.sh

  docker:
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: socheatsok78/uses/.github/workflows/docker-buildx-bake.yml@main
    with:
      flavor: latest=falses
      tags: type=raw,value=${{ matrix.version }}
      permit-login: false
      permit-push: false
      permit-cache: false
    secrets: inherit
